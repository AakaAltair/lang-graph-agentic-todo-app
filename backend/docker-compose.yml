version: '3.8'
services:
  db:
    # --- THIS IS THE CHANGE ---
    image: pgvector/pgvector:pg16 # Use the pgvector image for PostgreSQL 16
    
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=agentic_todo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # --- ADD THIS COMMAND TO ENABLE THE EXTENSION ---
    command: postgres -c 'shared_preload_libraries=pg_stat_statements' -c 'pg_stat_statements.track=all' -c 'max_connections=200'

volumes:
  postgres_data: